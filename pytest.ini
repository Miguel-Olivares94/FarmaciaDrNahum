# pytest.ini
[pytest]
DJANGO_SETTINGS_MODULE = collico_sw.settings
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
addopts = 
    --verbose
    --strict-markers
    --tb=short
    --cov=farmacia
    --cov-report=html
    --cov-report=term-missing
testpaths = farmacia/tests
markers =
    django_db: Marca test que requiere acceso a BD
    slow: Marca tests lentos
