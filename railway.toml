[build]
builder = "dockerfile"

[deploy]
startCommand = "python manage.py collectstatic --noinput && python manage.py migrate --noinput && (python manage.py loaddata datos_farmacia.json --ignorenonexistent || echo 'loaddata omitido') && gunicorn collico_sw.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
healthcheckPath = "/"
restartPolicyType = "on_failure"
