[build]
builder = "nixpacks"

[deploy]
startCommand = "python manage.py collectstatic --noinput && python manage.py migrate --noinput && python manage.py loaddata datos_farmacia.json --ignorenonexistent && gunicorn collico_sw.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60"
healthcheckPath = "/"
restartPolicyType = "on_failure"
