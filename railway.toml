[build]
builder = "nixpacks"

[deploy]
startCommand = "python manage.py collectstatic --noinput && python manage.py migrate --noinput && python manage.py shell -c \"from farmacia.models import Medicamento; import subprocess, sys; subprocess.run(['python','manage.py','loaddata','datos_farmacia.json','--ignorenonexistent'], check=False) if not Medicamento.objects.exists() else print('Datos ya cargados')\" && gunicorn collico_sw.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60"
healthcheckPath = "/"
restartPolicyType = "on_failure"
